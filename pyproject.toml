[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher-editor"
version = "0.1.0"
description = "GUI editor for epics_launcher menu configuration files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyQt5>=5.12",
]

[project.optional-dependencies]
remote = ["paramiko>=2.7"]
dev = ["pytest", "paramiko"]

[project.scripts]
launcher-editor = "launcher_editor.gui.app:main"

[tool.setuptools.packages.find]
include = ["launcher_editor*"]

[tool.setuptools.package-data]
"launcher_editor.gui" = ["style.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
